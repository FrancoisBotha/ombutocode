<style>
  :root {
    --bg: #0d1117;
    --bg-panel: #131a23;
    --bg-elev: #1b2430;
    --line: #263241;
    --line-soft: #1d2734;
    --fg: #e6edf3;
    --fg-dim: #8b98a8;
    --fg-faint: #5a6675;
    --accent: #58a6ff;
    --edge: #3a4757;
    --edge-hi: #58a6ff;
    --t-ui: #7ee0c0;
    --t-bridge: #d9a441;
    --t-process: #a78bfa;
    --t-service: #58a6ff;
    --t-data: #f0836a;
    --t-external: #9aa7b6;
    --warn: #f0b849;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-panel);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  header h1 span { color: var(--fg-dim); font-weight: 400; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-dim); }
  .meta b { color: var(--fg); font-weight: 500; font-family: var(--mono); }
  .dirty { color: var(--warn); }

  /* ---------- layout ---------- */
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  #stage { flex: 1 1 auto; position: relative; min-width: 0; background:
      radial-gradient(circle at 30% 20%, #131c27 0%, var(--bg) 62%); }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.panning { cursor: grabbing; }

  aside {
    flex: 0 0 336px;
    border-left: 1px solid var(--line);
    background: var(--bg-panel);
    overflow-y: auto;
    padding: 14px 16px 40px;
  }
  aside h2 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.09em; color: var(--fg-faint); font-weight: 600;
  }
  aside section { margin-bottom: 22px; }

  /* ---------- controls ---------- */
  .controls {
    position: absolute; top: 12px; left: 12px; z-index: 5;
    display: flex; flex-direction: column; gap: 8px; width: 252px;
  }
  input[type=search] {
    width: 100%; padding: 7px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg-elev);
    color: var(--fg); font-size: 13px; font-family: inherit;
  }
  input[type=search]:focus { outline: none; border-color: var(--accent); }
  .legend {
    background: color-mix(in srgb, var(--bg-panel) 88%, transparent);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
    backdrop-filter: blur(6px);
  }
  .legend h2 { margin-bottom: 6px; }
  .lg-item {
    display: flex; align-items: center; gap: 7px; font-size: 12px;
    padding: 2px 0; cursor: pointer; user-select: none; color: var(--fg-dim);
  }
  .lg-item.on { color: var(--fg); }
  .lg-item.off .sw { opacity: 0.22; }
  .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .zoombar { display: flex; gap: 6px; }
  .zoombar button, .reset {
    flex: 1; padding: 5px 8px; font-size: 12px; font-family: inherit;
    background: var(--bg-elev); color: var(--fg-dim);
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  }
  .zoombar button:hover, .reset:hover { color: var(--fg); border-color: var(--fg-faint); }

  /* ---------- graph ---------- */
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.3; opacity: 0.5; }
  .edge.unknown { stroke-dasharray: 4 3; stroke: var(--warn); opacity: 0.55; }
  .edge.hi { stroke: var(--edge-hi); stroke-width: 2.2; opacity: 1; }
  .edge.hi-in { stroke: var(--t-ui); stroke-width: 2.2; opacity: 1; }
  .edge.flow { stroke: var(--t-bridge); stroke-width: 2.6; opacity: 1; }
  .edge.dim { opacity: 0.07; }

  .node { cursor: pointer; }
  .node rect {
    stroke-width: 1.4; rx: 8;
    fill: var(--bg-elev);
  }
  .node .accentbar { stroke: none; rx: 2; }
  .node text.title { font-size: 12.5px; font-weight: 600; fill: var(--fg); pointer-events: none; }
  .node text.sub { font-size: 10.5px; fill: var(--fg-faint); font-family: var(--mono); pointer-events: none; }
  .node.dim { opacity: 0.16; }
  .node.sel rect { stroke-width: 2.4; }
  .node.sel text.title { fill: #fff; }
  .node.match rect { stroke: var(--warn); stroke-width: 2.2; }
  .node.hidden { display: none; }

  /* ---------- side panel ---------- */
  .flow-item, .rel {
    border: 1px solid var(--line-soft); border-radius: 7px;
    padding: 8px 10px; margin-bottom: 6px; cursor: pointer; background: var(--bg-elev);
  }
  .flow-item:hover, .rel:hover { border-color: var(--fg-faint); }
  .flow-item.on { border-color: var(--t-bridge); background: #241f14; }
  .flow-item .ft { font-weight: 600; font-size: 12.5px; }
  .flow-item .fd { font-size: 11.5px; color: var(--fg-dim); margin-top: 3px; }
  .rel { display: flex; align-items: baseline; gap: 8px; }
  .rel .rn { font-weight: 600; font-size: 12.5px; }
  .rel .rt {
    font-family: var(--mono); font-size: 10px; color: var(--fg-faint);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: auto; flex: none;
  }
  .pill {
    display: inline-block; font-size: 10px; font-family: var(--mono);
    padding: 1px 7px; border-radius: 20px; border: 1px solid currentColor;
  }
  .path { font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim); word-break: break-all; }
  .role { font-size: 12.5px; color: var(--fg-dim); margin: 8px 0 0; }
  ul.tight { margin: 4px 0 0; padding-left: 16px; }
  ul.tight li { font-size: 11.5px; color: var(--fg-dim); margin-bottom: 3px; font-family: var(--mono); word-break: break-word; }
  ul.tight.prose li { font-family: inherit; font-size: 12px; }
  .empty { font-size: 12px; color: var(--fg-faint); font-style: italic; }
  .hint { font-size: 12px; color: var(--fg-faint); }
</style>

<script>
(function () {
  'use strict';

  const DATA = JSON.parse(document.getElementById('codemap-data').textContent);
  const byId = new Map(DATA.nodes.map(n => [n.id, n]));

  const TYPES = {
    ui:       { label: 'UI / renderer',   color: getComputedStyle(document.documentElement).getPropertyValue('--t-ui').trim() },
    bridge:   { label: 'IPC bridge',      color: getComputedStyle(document.documentElement).getPropertyValue('--t-bridge').trim() },
    process:  { label: 'Process / entry', color: getComputedStyle(document.documentElement).getPropertyValue('--t-process').trim() },
    service:  { label: 'Service',         color: getComputedStyle(document.documentElement).getPropertyValue('--t-service').trim() },
    data:     { label: 'Data store',      color: getComputedStyle(document.documentElement).getPropertyValue('--t-data').trim() },
    external: { label: 'External',        color: getComputedStyle(document.documentElement).getPropertyValue('--t-external').trim() }
  };

  // ---------- header ----------
  document.getElementById('m-commit').textContent = DATA.generated_from_commit.slice(0, 10);
  document.getElementById('m-gen').textContent = DATA.generated_at.replace('T', ' ').replace(/\..*/, ' UTC');
  document.getElementById('m-dirty').textContent = DATA.working_tree_dirty ? '⚠ working tree dirty at generation' : '';
  document.getElementById('m-counts').textContent =
    DATA.nodes.length + ' modules · ' + DATA.edges.length + ' relationships · ' + DATA.flows.length + ' flows';

  // ---------- layered layout (longest-path layering + barycentre crossing reduction) ----------
  const NW = 168, NH = 46, HGAP = 30, VGAP = 96;

  const out = new Map(), inc = new Map();
  DATA.nodes.forEach(n => { out.set(n.id, []); inc.set(n.id, []); });
  DATA.edges.forEach(e => { out.get(e.from).push(e.to); inc.get(e.to).push(e.from); });

  // Longest-path layering, ignoring back-edges of cycles.
  const layer = new Map();
  DATA.nodes.forEach(n => layer.set(n.id, 0));
  for (let pass = 0; pass < DATA.nodes.length; pass++) {
    let moved = false;
    DATA.edges.forEach(e => {
      if (e.from === e.to) return;
      if (layer.get(e.to) < layer.get(e.from) + 1) {
        // cycle guard: don't push a node that already sits above its own ancestor chain
        if (layer.get(e.from) < DATA.nodes.length) {
          layer.set(e.to, layer.get(e.from) + 1);
          moved = true;
        }
      }
    });
    if (!moved) break;
  }

  const layers = [];
  DATA.nodes.forEach(n => {
    const L = layer.get(n.id);
    (layers[L] = layers[L] || []).push(n.id);
  });
  for (let i = 0; i < layers.length; i++) layers[i] = layers[i] || [];

  const order = new Map();
  layers.forEach(row => row.forEach((id, i) => order.set(id, i)));

  function bary(id, dir) {
    const nb = dir === 'up' ? inc.get(id) : out.get(id);
    const vals = nb.map(x => order.get(x)).filter(v => v !== undefined);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : order.get(id);
  }
  for (let sweep = 0; sweep < 12; sweep++) {
    const dir = sweep % 2 === 0 ? 'up' : 'down';
    const seq = dir === 'up' ? layers.map((_, i) => i) : layers.map((_, i) => layers.length - 1 - i);
    seq.forEach(li => {
      const row = layers[li];
      row.sort((a, b) => bary(a, dir) - bary(b, dir));
      row.forEach((id, i) => order.set(id, i));
    });
  }

  const widest = Math.max(...layers.map(r => r.length));
  const canvasW = widest * (NW + HGAP);
  const pos = new Map();
  layers.forEach((row, li) => {
    const rowW = row.length * (NW + HGAP);
    const x0 = (canvasW - rowW) / 2;
    row.forEach((id, i) => {
      pos.set(id, { x: x0 + i * (NW + HGAP) + HGAP / 2, y: li * (NH + VGAP) + 40 });
    });
  });

  // ---------- svg ----------
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  const root = document.createElementNS(NS, 'g');
  const gEdges = document.createElementNS(NS, 'g');
  const gNodes = document.createElementNS(NS, 'g');
  const defs = document.createElementNS(NS, 'defs');
  root.append(gEdges, gNodes);
  svg.append(defs, root);

  ['edge', 'edge-hi', 'edge-in', 'edge-flow', 'edge-unknown'].forEach((key, i) => {
    const colors = ['#3a4757', '#58a6ff', '#7ee0c0', '#d9a441', '#f0b849'];
    const m = document.createElementNS(NS, 'marker');
    m.setAttribute('id', 'arrow-' + key);
    m.setAttribute('viewBox', '0 0 10 10');
    m.setAttribute('refX', '9'); m.setAttribute('refY', '5');
    m.setAttribute('markerWidth', '6'); m.setAttribute('markerHeight', '6');
    m.setAttribute('orient', 'auto-start-reverse');
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M0,0 L10,5 L0,10 z');
    p.setAttribute('fill', colors[i]);
    m.append(p); defs.append(m);
  });

  const edgeEls = DATA.edges.map(e => {
    const p = document.createElementNS(NS, 'path');
    const unknown = /^unknown\b/.test(e.evidence);
    p.setAttribute('class', 'edge' + (unknown ? ' unknown' : ''));
    p.setAttribute('marker-end', 'url(#arrow-' + (unknown ? 'edge-unknown' : 'edge') + ')');
    gEdges.append(p);
    return { e, el: p, unknown };
  });

  const nodeEls = DATA.nodes.map(n => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'node');
    const color = TYPES[n.type].color;

    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('width', NW); rect.setAttribute('height', NH);
    rect.setAttribute('stroke', color);
    g.append(rect);

    const bar = document.createElementNS(NS, 'rect');
    bar.setAttribute('class', 'accentbar');
    bar.setAttribute('x', 0); bar.setAttribute('y', 8);
    bar.setAttribute('width', 3.5); bar.setAttribute('height', NH - 16);
    bar.setAttribute('fill', color);
    g.append(bar);

    const t1 = document.createElementNS(NS, 'text');
    t1.setAttribute('class', 'title'); t1.setAttribute('x', 13); t1.setAttribute('y', 20);
    t1.textContent = n.label;
    g.append(t1);

    const t2 = document.createElementNS(NS, 'text');
    t2.setAttribute('class', 'sub'); t2.setAttribute('x', 13); t2.setAttribute('y', 35);
    const short = n.path.replace('.ombutocode/src/src/', '…/').replace('.ombutocode/src/', '…/').replace('.ombutocode/', '…/');
    t2.textContent = short.length > 26 ? short.slice(0, 25) + '…' : short;
    g.append(t2);

    const tip = document.createElementNS(NS, 'title');
    tip.textContent = n.label + '\n' + n.path + '\n\n' + n.role;
    g.append(tip);

    gNodes.append(g);
    return { n, g, rect };
  });

  function place() {
    nodeEls.forEach(({ n, g }) => {
      const p = pos.get(n.id);
      g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')');
    });
    edgeEls.forEach(({ e, el }) => {
      const a = pos.get(e.from), b = pos.get(e.to);
      const ax = a.x + NW / 2, bx = b.x + NW / 2;
      let ay, by;
      if (b.y >= a.y + NH) { ay = a.y + NH; by = b.y; }
      else if (a.y >= b.y + NH) { ay = a.y; by = b.y + NH; }
      else { ay = a.y + NH / 2; by = b.y + NH / 2; }
      const mid = (ay + by) / 2;
      el.setAttribute('d', 'M' + ax + ',' + ay + ' C' + ax + ',' + mid + ' ' + bx + ',' + mid + ' ' + bx + ',' + by);
    });
  }
  place();

  // ---------- pan / zoom ----------
  const view = { x: 0, y: 0, k: 1 };
  function applyView() {
    root.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')');
  }
  function fit() {
    const bb = root.getBBox();
    const r = svg.getBoundingClientRect();
    const pad = 48;
    const k = Math.min((r.width - pad * 2) / bb.width, (r.height - pad * 2) / bb.height, 1.35);
    view.k = k;
    view.x = (r.width - bb.width * k) / 2 - bb.x * k;
    view.y = (r.height - bb.height * k) / 2 - bb.y * k;
    applyView();
  }
  function zoomBy(f) {
    const r = svg.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    view.x = cx - (cx - view.x) * f;
    view.y = cy - (cy - view.y) * f;
    view.k *= f;
    applyView();
  }
  document.getElementById('zin').onclick = () => zoomBy(1.25);
  document.getElementById('zout').onclick = () => zoomBy(0.8);
  document.getElementById('zfit').onclick = fit;

  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = svg.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
    view.x = mx - (mx - view.x) * f;
    view.y = my - (my - view.y) * f;
    view.k *= f;
    applyView();
  }, { passive: false });

  let panning = null, dragging = null;
  svg.addEventListener('pointerdown', ev => {
    const g = ev.target.closest('.node');
    if (g) {
      const rec = nodeEls.find(x => x.g === g);
      dragging = { id: rec.n.id, sx: ev.clientX, sy: ev.clientY, ox: pos.get(rec.n.id).x, oy: pos.get(rec.n.id).y, moved: false };
    } else {
      panning = { sx: ev.clientX, sy: ev.clientY, ox: view.x, oy: view.y };
      svg.classList.add('panning');
    }
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove', ev => {
    if (dragging) {
      const dx = (ev.clientX - dragging.sx) / view.k, dy = (ev.clientY - dragging.sy) / view.k;
      if (Math.abs(dx) + Math.abs(dy) > 2) dragging.moved = true;
      const p = pos.get(dragging.id);
      p.x = dragging.ox + dx; p.y = dragging.oy + dy;
      place();
    } else if (panning) {
      view.x = panning.ox + (ev.clientX - panning.sx);
      view.y = panning.oy + (ev.clientY - panning.sy);
      applyView();
    }
  });
  svg.addEventListener('pointerup', ev => {
    if (dragging && !dragging.moved) select(dragging.id);
    else if (panning && ev.target === svg) select(null);
    dragging = null; panning = null;
    svg.classList.remove('panning');
  });

  // ---------- state ----------
  let selected = null;
  let activeFlow = null;
  let query = '';
  const hiddenTypes = new Set();

  function render() {
    const flow = activeFlow ? DATA.flows.find(f => f.id === activeFlow) : null;
    const flowSet = flow ? new Set(flow.steps) : null;
    const flowPairs = new Set();
    if (flow) for (let i = 0; i < flow.steps.length - 1; i++) flowPairs.add(flow.steps[i] + '>' + flow.steps[i + 1]);

    const ups = selected ? new Set(inc.get(selected)) : new Set();
    const downs = selected ? new Set(out.get(selected)) : new Set();
    const focus = selected ? new Set([selected, ...ups, ...downs]) : null;

    nodeEls.forEach(({ n, g }) => {
      const hiddenByType = hiddenTypes.has(n.type);
      g.classList.toggle('hidden', hiddenByType);
      const matches = query && (
        n.id.includes(query) || n.label.toLowerCase().includes(query) ||
        n.path.toLowerCase().includes(query) || n.role.toLowerCase().includes(query) ||
        n.entrypoints.join(' ').toLowerCase().includes(query) ||
        n.evidence.join(' ').toLowerCase().includes(query) ||
        n.tests.join(' ').toLowerCase().includes(query)
      );
      g.classList.toggle('match', !!matches);
      let dim = false;
      if (focus && !focus.has(n.id)) dim = true;
      if (flowSet && !flowSet.has(n.id)) dim = true;
      if (query && !matches) dim = true;
      g.classList.toggle('dim', dim);
      g.classList.toggle('sel', n.id === selected);
    });

    edgeEls.forEach(({ e, el, unknown }) => {
      el.classList.remove('hi', 'hi-in', 'flow', 'dim');
      let marker = unknown ? 'edge-unknown' : 'edge';
      const inFlow = flowPairs.has(e.from + '>' + e.to);
      const touchesSel = selected && (e.from === selected || e.to === selected);
      if (inFlow) { el.classList.add('flow'); marker = 'edge-flow'; }
      else if (touchesSel && e.to === selected) { el.classList.add('hi-in'); marker = 'edge-in'; }
      else if (touchesSel) { el.classList.add('hi'); marker = 'edge-hi'; }
      else if (flowSet || focus || query) { el.classList.add('dim'); }
      if (hiddenTypes.has(byId.get(e.from).type) || hiddenTypes.has(byId.get(e.to).type)) el.classList.add('dim');
      el.setAttribute('marker-end', 'url(#arrow-' + marker + ')');
    });

    renderFlows();
    renderDetail();
  }

  function select(id) {
    selected = (id === selected) ? null : id;
    render();
  }

  // ---------- legend ----------
  const legend = document.getElementById('legend');
  Object.entries(TYPES).forEach(([key, t]) => {
    const row = document.createElement('div');
    row.className = 'lg-item on';
    row.innerHTML = '<span class="sw" style="background:' + t.color + '"></span><span>' + t.label + '</span>';
    row.onclick = () => {
      if (hiddenTypes.has(key)) hiddenTypes.delete(key); else hiddenTypes.add(key);
      row.classList.toggle('on', !hiddenTypes.has(key));
      row.classList.toggle('off', hiddenTypes.has(key));
      render();
    };
    legend.append(row);
  });

  // ---------- flows ----------
  const flowsEl = document.getElementById('flows');
  function renderFlows() {
    flowsEl.innerHTML = '';
    DATA.flows.forEach(f => {
      const d = document.createElement('div');
      d.className = 'flow-item' + (activeFlow === f.id ? ' on' : '');
      const t = document.createElement('div'); t.className = 'ft'; t.textContent = f.id;
      const s = document.createElement('div'); s.className = 'fd';
      s.textContent = activeFlow === f.id ? f.trigger + ' → ' + f.outcome : f.steps.length + ' steps · ' + f.steps[0] + ' → ' + f.steps[f.steps.length - 1];
      d.append(t, s);
      d.onclick = () => { activeFlow = activeFlow === f.id ? null : f.id; render(); };
      flowsEl.append(d);
    });
  }

  // ---------- detail panel ----------
  const detailEl = document.getElementById('detail');
  function ul(items, prose) {
    if (!items || !items.length) return '<div class="empty">none</div>';
    return '<ul class="tight' + (prose ? ' prose' : '') + '">' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>';
  }
  function esc(s) {
    return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  function renderDetail() {
    if (!selected) {
      detailEl.innerHTML =
        '<h2>Module detail</h2><p class="hint">Click a module to see its upstream callers, downstream dependencies, tests and the flows it belongs to. ' +
        'Drag nodes to rearrange, scroll to zoom, drag the background to pan. Dashed amber edges are relationships with no resolved source evidence.</p>';
      return;
    }
    const n = byId.get(selected);
    const color = TYPES[n.type].color;
    const upstream = DATA.edges.filter(e => e.to === n.id);
    const downstream = DATA.edges.filter(e => e.from === n.id);
    const inFlows = DATA.flows.filter(f => f.steps.includes(n.id));

    detailEl.innerHTML =
      '<h2>Module detail</h2>' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' +
        '<strong style="font-size:15px">' + esc(n.label) + '</strong>' +
        '<span class="pill" style="color:' + color + '">' + n.type + '</span>' +
      '</div>' +
      '<div class="path">' + esc(n.path) + '</div>' +
      '<p class="role">' + esc(n.role) + '</p>' +
      '<h2 style="margin-top:18px">Upstream callers (' + upstream.length + ')</h2><div id="d-up"></div>' +
      '<h2 style="margin-top:18px">Downstream dependencies (' + downstream.length + ')</h2><div id="d-down"></div>' +
      '<h2 style="margin-top:18px">Flows (' + inFlows.length + ')</h2><div id="d-flows"></div>' +
      '<h2 style="margin-top:18px">Entrypoints</h2>' + ul(n.entrypoints) +
      '<h2 style="margin-top:18px">Tests (' + n.tests.length + ')</h2>' + ul(n.tests) +
      '<h2 style="margin-top:18px">Constraints</h2>' + ul(n.constraints, true) +
      '<h2 style="margin-top:18px">Evidence</h2>' + ul(n.evidence);

    function relList(target, edges, otherKey) {
      const box = document.getElementById(target);
      if (!edges.length) { box.innerHTML = '<div class="empty">none</div>'; return; }
      edges.forEach(e => {
        const other = byId.get(e[otherKey]);
        const d = document.createElement('div');
        d.className = 'rel';
        d.innerHTML = '<span class="rn" style="color:' + TYPES[other.type].color + '">' + esc(other.label) + '</span>' +
                      '<span class="rt">' + e.type + '</span>';
        d.title = e.evidence;
        d.onclick = () => select(other.id);
        box.append(d);
      });
    }
    relList('d-up', upstream, 'from');
    relList('d-down', downstream, 'to');

    const fbox = document.getElementById('d-flows');
    if (!inFlows.length) fbox.innerHTML = '<div class="empty">none</div>';
    inFlows.forEach(f => {
      const d = document.createElement('div');
      d.className = 'flow-item' + (activeFlow === f.id ? ' on' : '');
      d.innerHTML = '<div class="ft">' + esc(f.id) + '</div><div class="fd">' + esc(f.outcome) + '</div>';
      d.onclick = () => { activeFlow = activeFlow === f.id ? null : f.id; render(); };
      fbox.append(d);
    });
  }

  // ---------- search ----------
  document.getElementById('search').addEventListener('input', ev => {
    query = ev.target.value.trim().toLowerCase();
    render();
  });
  document.getElementById('clearsel').onclick = () => {
    selected = null; activeFlow = null; query = '';
    document.getElementById('search').value = '';
    render(); fit();
  };

  render();
  fit();
  window.addEventListener('resize', () => { /* keep current view */ });
})();
</script>
